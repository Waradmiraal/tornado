<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tornado Grid — Live Storm Chasers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0a0a0f;
      --bg-card: #14141f;
      --bg-nav: #111118;
      --bg-sidebar: #111118;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --text-primary: #e4e4e7;
      --text-secondary: #a1a1aa;
      --text-muted: #71717a;
      --border: #27272a;
      --red: #ef4444;
      --radius: 12px;
      --sidebar-width: 340px;
      --nav-height: 64px;
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
    }

    body {
      display: grid;
      grid-template-columns: 1fr var(--sidebar-width);
      grid-template-rows: var(--nav-height) 1fr;
      transition: grid-template-columns var(--transition);
    }

    /* ─── Navigation ─── */
    nav {
      grid-column: 1 / -1;
      background: var(--bg-nav);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(12px);
      z-index: 10;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo {
      height: 36px;
      filter: brightness(1.1);
    }

    .nav-title {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--bg-card);
      color: var(--text-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
      user-select: none;
    }

    .btn-toggle:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .btn-toggle svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    /* ─── Live indicator ─── */
    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(239, 68, 68, 0.08));
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 700;
      color: #ff6b6b;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      box-shadow: 0 0 16px rgba(239, 68, 68, 0.15), inset 0 0 12px rgba(239, 68, 68, 0.05);
      position: relative;
      overflow: hidden;
    }

    .live-badge::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 107, 107, 0.08), transparent);
      animation: shimmer 3s ease-in-out infinite;
    }

    @keyframes shimmer {
      0%, 100% { transform: translateX(-100%); }
      50% { transform: translateX(100%); }
    }

    .live-dot-wrapper {
      position: relative;
      width: 10px;
      height: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background: var(--red);
      border-radius: 50%;
      position: relative;
      z-index: 1;
      box-shadow: 0 0 6px rgba(239, 68, 68, 0.8);
    }

    .live-dot-wrapper::before,
    .live-dot-wrapper::after {
      content: '';
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--red);
      opacity: 0;
    }

    .live-dot-wrapper::before {
      animation: ripple 2s ease-out infinite;
    }

    .live-dot-wrapper::after {
      animation: ripple 2s ease-out infinite 1s;
    }

    @keyframes ripple {
      0%   { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(3.5); opacity: 0; }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    /* ─── Video Grid ─── */
    .videos {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 12px;
      padding: 12px;
      min-height: 0;
    }

    .video {
      position: relative;
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--bg-card);
      border: 1px solid var(--border);
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    .video:hover {
      border-color: var(--accent);
      box-shadow: 0 0 20px rgba(99, 102, 241, 0.1);
    }

    .video iframe {
      width: 100%;
      height: 100%;
      display: block;
      border: none;
      position: relative;
      z-index: 1;
    }

    /* ─── Offline placeholder ─── */
    .video-offline {
      position: absolute;
      inset: 0;
      z-index: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: var(--bg-card);
      text-align: center;
      padding: 20px;
      pointer-events: none;
    }

    .video-offline a {
      pointer-events: auto;
    }

    .video-offline svg {
      width: 48px;
      height: 48px;
      color: var(--text-muted);
      opacity: 0.5;
    }

    .video-offline-name {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .video-offline-status {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .video-offline-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
      padding: 8px 18px;
      background: var(--red);
      color: #fff;
      font-size: 0.8rem;
      font-weight: 600;
      text-decoration: none;
      border-radius: 8px;
      transition: background var(--transition), transform var(--transition);
    }

    .video-offline-link:hover {
      background: #dc2626;
      transform: scale(1.03);
    }

    .video-offline-link svg {
      width: 14px;
      height: 14px;
      color: #fff;
      opacity: 1;
    }

    /* ─── Video hover overlay ─── */
    .video-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 28px 14px 10px;
      background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      pointer-events: none;
      opacity: 0;
      z-index: 2;
      transform: translateY(4px);
      transition: opacity var(--transition), transform var(--transition);
    }

    .video:hover .video-overlay {
      opacity: 1;
      transform: translateY(0);
    }

    .video-label {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .video-link {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      background: rgba(239, 68, 68, 0.8);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 600;
      text-decoration: none;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      transition: background var(--transition);
    }

    .video-link:hover {
      background: rgba(239, 68, 68, 1);
    }

    .video-link svg {
      width: 12px;
      height: 12px;
    }

    /* ─── Sidebar ─── */
    .sidebar {
      background: var(--bg-sidebar);
      border-left: 1px solid var(--border);
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .sidebar-section {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .sidebar-section-header {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-secondary);
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sidebar-section-header svg {
      width: 14px;
      height: 14px;
      opacity: 0.7;
    }

    .sidebar-section img {
      width: 100%;
      display: block;
    }

    .sidebar-section iframe {
      width: 100%;
      border: none;
      display: block;
    }

    .channel-list {
      list-style: none;
      padding: 0;
    }

    .channel-list li a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      color: var(--text-primary);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      border-bottom: 1px solid var(--border);
      transition: background var(--transition);
    }

    .channel-list li:last-child a {
      border-bottom: none;
    }

    .channel-list li a:hover {
      background: rgba(99, 102, 241, 0.08);
    }

    .channel-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
      flex-shrink: 0;
    }

    .channel-dot.live {
      background: var(--red);
      box-shadow: 0 0 6px rgba(239, 68, 68, 0.5);
      animation: pulse 2s ease-in-out infinite;
    }

    .channel-yt {
      margin-left: auto;
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    /* ─── Alerts feed ─── */
    .alerts-list {
      max-height: 300px;
      overflow-y: auto;
    }

    .alert-item {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background var(--transition);
    }

    .alert-item:last-child {
      border-bottom: none;
    }

    .alert-item:hover {
      background: rgba(99, 102, 241, 0.06);
    }

    .alert-item a {
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .alert-severity {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }

    .alert-severity.tornado {
      color: #f43f5e;
    }

    .alert-severity.severe {
      color: #f97316;
    }

    .alert-severity.watch {
      color: #eab308;
    }

    .alert-severity.other {
      color: var(--accent-hover);
    }

    .alert-severity-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .alert-headline {
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-primary);
      line-height: 1.35;
      margin-bottom: 3px;
    }

    .alert-area {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .alert-time {
      font-size: 0.65rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .alerts-empty {
      padding: 20px 14px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    .alerts-empty svg {
      width: 32px;
      height: 32px;
      margin-bottom: 8px;
      opacity: 0.4;
    }

    .alerts-loading {
      padding: 16px 14px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.78rem;
    }

    .alert-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 9px;
      font-size: 0.65rem;
      font-weight: 700;
      margin-left: auto;
    }

    .alert-count.active {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
    }

    .alert-count.none {
      background: rgba(113, 113, 122, 0.2);
      color: var(--text-muted);
    }

    /* ─── SPC link cards ─── */
    .spc-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      text-decoration: none;
      color: var(--text-primary);
      transition: background var(--transition);
    }

    .spc-card:hover {
      background: rgba(99, 102, 241, 0.06);
    }

    .spc-card-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .spc-card-icon svg {
      width: 20px;
      height: 20px;
    }

    .spc-card-icon.outlook {
      background: rgba(234, 179, 8, 0.12);
      color: #eab308;
    }

    .spc-card-icon.watch {
      background: rgba(249, 115, 22, 0.12);
      color: #f97316;
    }

    .spc-card-icon.reports {
      background: rgba(239, 68, 68, 0.12);
      color: #ef4444;
    }

    .spc-card-icon.md {
      background: rgba(99, 102, 241, 0.12);
      color: var(--accent);
    }

    .spc-card-body {
      flex: 1;
      min-width: 0;
    }

    .spc-card-title {
      font-size: 0.82rem;
      font-weight: 600;
      line-height: 1.3;
    }

    .spc-card-desc {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .spc-card-badge {
      font-size: 0.65rem;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 4px;
      white-space: nowrap;
    }

    .spc-card-badge.green {
      background: rgba(34, 197, 94, 0.15);
      color: #22c55e;
    }

    .spc-card-badge.yellow {
      background: rgba(234, 179, 8, 0.15);
      color: #eab308;
    }

    .spc-card-badge.orange {
      background: rgba(249, 115, 22, 0.15);
      color: #f97316;
    }

    .spc-card-badge.red {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
    }

    .spc-card-badge.purple {
      background: rgba(168, 85, 247, 0.15);
      color: #a855f7;
    }

    .spc-card-arrow {
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .spc-card-arrow svg {
      width: 14px;
      height: 14px;
    }

    .sidebar-section img {
      width: 100%;
      display: block;
    }

    .sidebar.hidden {
      display: none;
    }

    .grid-no-sidebar {
      grid-template-columns: 1fr;
    }

    /* ─── Scrollbar ─── */
    .sidebar::-webkit-scrollbar {
      width: 6px;
    }
    .sidebar::-webkit-scrollbar-track {
      background: transparent;
    }
    .sidebar::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }
    .sidebar::-webkit-scrollbar-thumb:hover {
      background: #3f3f46;
    }

    /* ─── Responsive ─── */
    @media (max-width: 900px) {
      :root {
        --sidebar-width: 280px;
      }
    }

    @media (max-width: 700px) {
      html, body {
        overflow-y: auto;
        overflow-x: hidden;
      }

      body {
        grid-template-columns: 1fr;
        grid-template-rows: var(--nav-height) auto;
      }

      .sidebar {
        display: none;
      }

      .videos {
        grid-template-columns: 1fr;
        grid-template-rows: auto;
        overflow: visible;
      }

      .video {
        aspect-ratio: 16 / 9;
      }

      .nav-title {
        display: none;
      }

      .kbd-hint {
        display: none;
      }

      .video-overlay {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ─── Portrait / vertical monitor ─── */
    @media (orientation: portrait) and (min-width: 701px) {
      html, body {
        height: 100%;
        overflow: hidden;
      }

      body {
        grid-template-columns: 1fr;
        grid-template-rows: var(--nav-height) 1fr;
      }

      body:not(.grid-no-sidebar) {
        grid-template-columns: 1fr var(--sidebar-width);
      }

      nav {
        position: sticky;
        top: 0;
      }

      .videos {
        grid-template-columns: 1fr;
        grid-template-rows: repeat(4, 1fr);
        gap: 8px;
        padding: 8px;
        min-height: 0;
        overflow: hidden;
      }

      .video {
        aspect-ratio: auto;
      }

      .videos.has-focus {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr;
      }

      .videos.has-focus .video.focused {
        aspect-ratio: auto;
        height: 100%;
      }

      .sidebar {
        border-left: 1px solid var(--border);
        border-top: none;
        overflow-y: auto;
      }

      .sidebar.hidden {
        display: none;
      }

      .kbd-hint {
        bottom: 8px;
        right: 8px;
        font-size: 0.62rem;
      }
    }

    /* Portrait + wide enough for sidebar (1080+) */
    @media (orientation: portrait) and (min-width: 1001px) {
      :root {
        --sidebar-width: 300px;
      }
    }

    /* Portrait + narrow (701-1000): no sidebar room, stack it below */
    @media (orientation: portrait) and (max-width: 1000px) and (min-width: 701px) {
      :root {
        --nav-height: 56px;
      }

      body, body:not(.grid-no-sidebar) {
        grid-template-columns: 1fr;
        grid-template-rows: var(--nav-height) 1fr auto;
      }

      body.grid-no-sidebar {
        grid-template-rows: var(--nav-height) 1fr;
      }

      html, body {
        height: auto;
        min-height: 100vh;
        overflow-y: auto;
      }

      .videos {
        grid-template-columns: 1fr;
        grid-template-rows: repeat(4, auto);
        overflow: visible;
      }

      .video {
        aspect-ratio: 16 / 9;
      }

      .sidebar {
        grid-column: 1;
        border-left: none;
        border-top: 1px solid var(--border);
        overflow: visible;
      }

      .sidebar-section img {
        max-height: 200px;
        object-fit: contain;
        background: var(--bg-card);
      }
    }

    /* ─── Tile expand/focus ─── */
    .videos.has-focus {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
    }

    .videos.has-focus .video:not(.focused) {
      display: none;
    }

    .video.focused {
      border-color: var(--accent);
      box-shadow: 0 0 24px rgba(99, 102, 241, 0.15);
    }

    .video-expand {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      color: #fff;
      cursor: pointer;
      transition: all var(--transition);
      backdrop-filter: blur(4px);
    }

    .video-expand:hover {
      background: var(--accent);
      border-color: var(--accent);
    }

    .video-expand svg {
      width: 14px;
      height: 14px;
    }

    /* ─── Keyboard hints ─── */
    .kbd-hint {
      position: fixed;
      bottom: 12px;
      right: 12px;
      background: rgba(20, 20, 31, 0.92);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.68rem;
      color: var(--text-muted);
      z-index: 20;
      backdrop-filter: blur(8px);
      line-height: 1.7;
      pointer-events: none;
      opacity: 0.6;
      transition: opacity var(--transition);
    }

    .kbd-hint:hover {
      opacity: 1;
    }

    .kbd-hint kbd {
      display: inline-block;
      padding: 1px 5px;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-family: inherit;
      font-size: 0.65rem;
      color: var(--text-secondary);
      margin: 0 2px;
    }

    /* ─── Toast notification ─── */
    .toast {
      position: fixed;
      top: calc(var(--nav-height) + 12px);
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 0.8rem;
      color: var(--text-primary);
      z-index: 30;
      opacity: 0;
      transition: all 0.25s ease;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ─── Cycle indicator ─── */
    .btn-toggle.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .cycle-ring {
      position: absolute;
      top: 6px;
      left: 6px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: var(--accent);
      z-index: 3;
      pointer-events: none;
      display: none;
    }

    .video.focused .cycle-ring.active {
      display: block;
      animation: cycle-spin var(--cycle-duration, 15s) linear infinite;
    }

    @keyframes cycle-spin {
      to { transform: rotate(360deg); }
    }

    /* ─── Alert sound button ─── */
    .btn-toggle .sound-icon-on,
    .btn-toggle .sound-icon-off {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .btn-toggle .sound-icon-off {
      display: none;
    }

    .btn-toggle.muted .sound-icon-on {
      display: none;
    }

    .btn-toggle.muted .sound-icon-off {
      display: block;
    }

    /* ─── Alert flash ─── */
    @keyframes alert-flash {
      0%, 100% { box-shadow: none; }
      50% { box-shadow: 0 0 20px rgba(239, 68, 68, 0.4), inset 0 0 20px rgba(239, 68, 68, 0.05); }
    }

    nav.alert-flash {
      animation: alert-flash 0.5s ease 3;
    }
  </style>
</head>
<body>

        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="16" height="16"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.992 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182M2.985 19.644l3.181-3.183"/></svg>

        <svg class="sound-icon-on" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M19.114 5.636a9 9 0 0 1 0 12.728M16.463 8.288a5.25 5.25 0 0 1 0 7.424M6.75 8.25l4.72-4.72a.75.75 0 0 1 1.28.53v15.88a.75.75 0 0 1-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.009 9.009 0 0 1 2.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75Z"/></svg>
        <svg class="sound-icon-off" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M17.25 9.75 19.5 12m0 0 2.25 2.25M19.5 12l2.25-2.25M19.5 12l-2.25 2.25m-10.5-6 4.72-4.72a.75.75 0 0 1 1.28.53v15.88a.75.75 0 0 1-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.009 9.009 0 0 1 2.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75Z"/></svg>

        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">

  <div class="videos" id="videoGrid"></div>

  <aside class="sidebar">

        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126Z"/></svg>

        Day 1 Convective Outlook

      <a class="spc-card" id="outlookFallback" href="https://www.spc.noaa.gov/products/outlook/day1otlk.html" target="_blank" rel="noopener noreferrer" style="display:none">
        <div class="spc-card-icon outlook">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126Z"/></svg>

        Active Watches
      </div>
      <a href="https://www.spc.noaa.gov/products/watch/" target="_blank" rel="noopener noreferrer">

        Today's Storm Reports
      </div>
      <a href="https://www.spc.noaa.gov/climo/reports/today.html" target="_blank" rel="noopener noreferrer">
        <img src="https://www.spc.noaa.gov/climo/reports/today.gif" alt="Today's Storm Reports" loading="lazy">

    <!-- SPC Mesoscale Discussions -->
    <div class="sidebar-section">
      <div class="sidebar-section-header">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M7.5 8.25h9m-9 3H12m-9.75 1.51c0 1.6 1.123 2.994 2.707 3.227 1.087.16 2.185.283 3.293.369V21l4.076-4.076a1.526 1.526 0 0 1 1.037-.443 48.2 48.2 0 0 0 5.476-.602c1.585-.233 2.708-1.626 2.708-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0 0 12 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741v6.018Z"/></svg>
        Mesoscale Discussions
      </div>
      <a href="https://www.spc.noaa.gov/products/md/" target="_blank" rel="noopener noreferrer">

  <!-- Keyboard shortcuts hint -->
  <div class="kbd-hint">
    <kbd>1</kbd>–<kbd>4</kbd> Focus &nbsp;
    <kbd>Esc</kbd> Grid &nbsp;
    <kbd>F</kbd> Fullscreen<br>
    <kbd>S</kbd> Sidebar &nbsp;
    <kbd>R</kbd> Refresh &nbsp;
    <kbd>C</kbd> Cycle &nbsp;
    <kbd>M</kbd> Mute
  </div>

  <script>
    const CHANNELS = [
      { id: 'UCV6hWxB0-u_IX7e-h4fEBAw', name: 'Reed Timmer' },
      { id: 'UCPqLI_AohMn1jnFg8ocMyHA', name: 'Brandon Copic' },
      { id: 'UCb0U1g5r4kH_NDMGiGRhysA', name: 'Connor Croff' },
      { id: 'UCXUU-_dJ-eGBh3-bjPNsalQ', name: 'StormChaserIRL' },
    ];

    const videoGrid = document.getElementById('videoGrid');
    let focusedTile = null;

    // ─── Toast notification ───
    let toastTimeout;
    function showToast(msg) {
      let el = document.getElementById('toast');
      if (!el) {
        el = document.createElement('div');
        el.id = 'toast';
        el.className = 'toast';
        document.body.appendChild(el);
      }
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => el.classList.remove('show'), 1500);
    }

    // ─── Build video tiles (lazy: data-src) ───
    CHANNELS.forEach((ch, i) => {
      const liveUrl = `https://www.youtube.com/channel/${ch.id}/live`;

      const tile = document.createElement('div');
      tile.className = 'video';
      tile.dataset.index = i;
      tile.innerHTML = `
        <div class="cycle-ring" id="cycleRing${i}"></div>
        <div class="video-offline">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="m15.75 10.5 4.72-4.72a.75.75 0 0 1 1.28.53v11.38a.75.75 0 0 1-1.28.53l-4.72-4.72M4.5 18.75h9a2.25 2.25 0 0 0 2.25-2.25v-9a2.25 2.25 0 0 0-2.25-2.25h-9A2.25 2.25 0 0 0 2.25 7.5v9a2.25 2.25 0 0 0 2.25 2.25Z"/>
          </svg>
          <div class="video-offline-name">${ch.name}</div>
          <div class="video-offline-status">Stream is offline</div>
          <a class="video-offline-link" href="${liveUrl}" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            Open on YouTube
          </a>
        </div>
        <div class="video-overlay">
          <span class="video-label">${ch.name}</span>
          <div style="display:flex;align-items:center;gap:6px">
            <button class="video-expand" title="Expand tile (${i + 1})">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9m11.25-5.25v4.5m0-4.5h-4.5m4.5 0L15 9m-11.25 11.25v-4.5m0 4.5h4.5m-4.5 0L9 15m11.25 5.25v-4.5m0 4.5h-4.5m4.5 0L15 15"/></svg>
            </button>
            <a class="video-link" href="${liveUrl}" target="_blank" rel="noopener noreferrer">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              YouTube
            </a>
          </div>
        </div>`;
      videoGrid.appendChild(tile);

      const iframe = document.createElement('iframe');
      iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen';
      iframe.setAttribute('allowfullscreen', '');
      iframe.dataset.src = `https://www.youtube.com/embed/live_stream?channel=${ch.id}&autoplay=1&mute=1`;
      tile.insertBefore(iframe, tile.querySelector('.video-overlay'));

      // Expand button click
      tile.querySelector('.video-expand').addEventListener('click', (e) => {
        e.stopPropagation();
        toggleTileFocus(tile);
      });
    });

    // ─── Lazy iframe loading via IntersectionObserver ───
    const lazyObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const iframe = entry.target.querySelector('iframe[data-src]');
          if (iframe && iframe.dataset.src) {
            iframe.src = iframe.dataset.src;
            delete iframe.dataset.src;
          }
          lazyObserver.unobserve(entry.target);
        }
      });
    }, { rootMargin: '200px' });

    document.querySelectorAll('.video').forEach(tile => lazyObserver.observe(tile));

    // ─── Tile expand/focus ───
    function toggleTileFocus(tile) {
      if (focusedTile === tile) {
        tile.classList.remove('focused');
        videoGrid.classList.remove('has-focus');
        focusedTile = null;
        showToast('Grid view');
      } else {
        if (focusedTile) focusedTile.classList.remove('focused');
        tile.classList.add('focused');
        videoGrid.classList.add('has-focus');
        focusedTile = tile;
        const name = CHANNELS[parseInt(tile.dataset.index)]?.name || 'Tile';
        showToast(`Focused: ${name}`);
      }
      localStorage.setItem('focusedTile', focusedTile ? focusedTile.dataset.index : '');
    }

    // ─── Double-click to fullscreen ───
    document.querySelectorAll('.video').forEach(tile => {
      tile.addEventListener('dblclick', () => {
        const iframe = tile.querySelector('iframe');
        if (!iframe) return;
        if (iframe.requestFullscreen) iframe.requestFullscreen();
        else if (iframe.webkitRequestFullscreen) iframe.webkitRequestFullscreen();
        else if (iframe.msRequestFullscreen) iframe.msRequestFullscreen();
      });
    });

    // ─── Keyboard shortcuts ───
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

      const tiles = document.querySelectorAll('.video');

      // 1-4: focus/expand tile
      if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        const idx = parseInt(e.key) - 1;
        if (tiles[idx]) toggleTileFocus(tiles[idx]);
        return;
      }

      // S: toggle sidebar
      if (e.key.toLowerCase() === 's' && !e.ctrlKey && !e.metaKey) {
        e.preventDefault();
        toggleSidebar();
        return;
      }

      // Escape: unfocus tile
      if (e.key === 'Escape') {
        if (focusedTile) toggleTileFocus(focusedTile);
        return;
      }

      // F: fullscreen focused tile
      if (e.key.toLowerCase() === 'f' && !e.ctrlKey && !e.metaKey) {
        if (focusedTile) {
          e.preventDefault();
          const iframe = focusedTile.querySelector('iframe');
          if (iframe) {
            if (iframe.requestFullscreen) iframe.requestFullscreen();
            else if (iframe.webkitRequestFullscreen) iframe.webkitRequestFullscreen();
          }
        }
        return;
      }

      // R: manual refresh SPC images
      if (e.key.toLowerCase() === 'r' && !e.ctrlKey && !e.metaKey) {
        e.preventDefault();
        refreshSPCImages();
        showToast('SPC images refreshed');
        return;
      }

      // C: toggle auto-cycle
      if (e.key.toLowerCase() === 'c' && !e.ctrlKey && !e.metaKey) {
        e.preventDefault();
        toggleCycle();
        return;
      }

      // M: toggle alert sound
      if (e.key.toLowerCase() === 'm' && !e.ctrlKey && !e.metaKey) {
        e.preventDefault();
        toggleAlertSound();
        return;
      }
    });

    // ─── Live NWS Severe Weather Alerts ───
    const ALERT_EVENTS = [
      'Tornado Warning', 'Tornado Watch',
      'Severe Thunderstorm Warning', 'Severe Thunderstorm Watch',
      'Extreme Wind Warning', 'Special Weather Statement'
    ];

    function classifyAlert(event) {
      if (event.includes('Tornado')) return 'tornado';
      if (event.includes('Severe') || event.includes('Extreme Wind')) return 'severe';
      if (event.includes('Watch')) return 'watch';
      return 'other';
    }

    function timeAgo(dateStr) {
      const diff = Date.now() - new Date(dateStr).getTime();
      const mins = Math.floor(diff / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return `${mins}m ago`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return `${hrs}h ago`;
      return `${Math.floor(hrs / 24)}d ago`;
    }

    async function fetchAlerts() {
      const container = document.getElementById('alertsList');
      const countEl = document.getElementById('alertCount');

      try {
        const resp = await fetch('https://api.weather.gov/alerts/active?status=actual&message_type=alert', {
          headers: { 'Accept': 'application/geo+json', 'User-Agent': 'TornadoGrid/1.0' }
        });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();

        const severeAlerts = (data.features || [])
          .filter(f => ALERT_EVENTS.includes(f.properties.event))
          .sort((a, b) => {
            const order = { tornado: 0, severe: 1, watch: 2, other: 3 };
            const ca = classifyAlert(a.properties.event);
            const cb = classifyAlert(b.properties.event);
            if (order[ca] !== order[cb]) return order[ca] - order[cb];
            return new Date(b.properties.sent) - new Date(a.properties.sent);
          })
          .slice(0, 50);

        countEl.textContent = severeAlerts.length;
        countEl.className = 'alert-count ' + (severeAlerts.length > 0 ? 'active' : 'none');

        checkNewAlerts(severeAlerts);

        if (severeAlerts.length === 0) {
          container.innerHTML = `
            <div class="alerts-empty">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
              <div>No active severe alerts</div>
            </div>`;
          return;
        }

        container.innerHTML = severeAlerts.map(f => {
          const p = f.properties;
          const cls = classifyAlert(p.event);
          const areas = (p.areaDesc || '').split(';').slice(0, 2).join(', ');
          const url = p.web || `https://alerts.weather.gov`;
          return `
            <div class="alert-item">
              <a href="${url}" target="_blank" rel="noopener noreferrer">
                <div class="alert-severity ${cls}">
                  <span class="alert-severity-dot"></span>
                  ${p.event}
                </div>
                <div class="alert-headline">${p.headline || p.event}</div>
                <div class="alert-area">${areas}</div>
                <div class="alert-time">${timeAgo(p.sent)}</div>
              </a>
            </div>`;
        }).join('');
      } catch (err) {
        container.innerHTML = `
          <div class="alerts-empty">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z"/></svg>
            <div>Could not load alerts</div>
          </div>`;
        countEl.textContent = '!';
        countEl.className = 'alert-count none';
      }
    }

    fetchAlerts();
    setInterval(fetchAlerts, 120000);

    // ─── Day 1 Outlook image with fallback URLs ───
    (function() {
      const img = document.getElementById('outlookImg');
      const link = document.getElementById('outlookLink');
      const fallback = document.getElementById('outlookFallback');
      const urls = [
        'https://www.spc.noaa.gov/products/outlook/day1otlk.gif',
        'https://www.spc.noaa.gov/products/outlook/day1otlk_2000.png',
        'https://www.spc.noaa.gov/products/outlook/day1otlk_1630.png',
        'https://www.spc.noaa.gov/products/outlook/day1otlk_1300.png',
        'https://www.spc.noaa.gov/products/outlook/day1otlk_1200.png',
        'https://www.spc.noaa.gov/products/outlook/day1otlk_0100.png',
      ];
      let attempt = 1;
      img.onerror = function() {
        if (attempt < urls.length) {
          img.src = urls[attempt++];
        } else {
          link.style.display = 'none';
          fallback.style.display = '';
        }
      };
    })();

    // ─── SPC Outlook badge (from NWS alerts API) ───
    async function updateOutlookBadge() {
      try {
        const resp = await fetch('https://api.weather.gov/alerts/active?status=actual&message_type=alert', {
          headers: { 'Accept': 'application/geo+json', 'User-Agent': 'TornadoGrid/1.0' }
        });
        if (!resp.ok) return;
        const data = await resp.json();
        const alerts = data.features || [];

        const badge = document.getElementById('outlookBadge');
        const hasTorWarn = alerts.some(f => f.properties.event === 'Tornado Warning');
        const hasSvrWarn = alerts.some(f => f.properties.event === 'Severe Thunderstorm Warning');
        const hasTorWatch = alerts.some(f => f.properties.event === 'Tornado Watch');
        const hasSvrWatch = alerts.some(f => f.properties.event === 'Severe Thunderstorm Watch');

        if (hasTorWarn) {
          badge.textContent = 'HIGH';
          badge.className = 'spc-card-badge red';
        } else if (hasSvrWarn && hasTorWatch) {
          badge.textContent = 'MDT';
          badge.className = 'spc-card-badge orange';
        } else if (hasSvrWarn || hasTorWatch) {
          badge.textContent = 'SLGT';
          badge.className = 'spc-card-badge yellow';
        } else if (hasSvrWatch) {
          badge.textContent = 'MRGL';
          badge.className = 'spc-card-badge green';
        } else {
          badge.textContent = 'NONE';
          badge.className = 'spc-card-badge green';
        }
      } catch (e) {
        // Fail silently
      }
    }

    updateOutlookBadge();
    setInterval(updateOutlookBadge, 120000);

    // ─── Auto-refresh SPC images (every 5 min) ───
    function refreshSPCImages() {
      const t = Date.now();
      document.querySelectorAll('.sidebar-section img').forEach(img => {
        const base = img.src.split('?')[0];
        img.src = base + '?t=' + t;
      });
    }
    setInterval(refreshSPCImages, 300000);

    // ─── Sidebar toggle + localStorage ───
    function toggleSidebar() {
      const sidebar = document.querySelector('.sidebar');
      sidebar.classList.toggle('hidden');
      document.body.classList.toggle('grid-no-sidebar');
      localStorage.setItem('sidebarHidden', sidebar.classList.contains('hidden'));
    }

    // ─── Auto-cycle through streams ───
    let cycleInterval = null;
    const CYCLE_DURATION = 15; // seconds

    function toggleCycle() {
      const btn = document.getElementById('btnCycle');
      if (cycleInterval) {
        clearInterval(cycleInterval);
        cycleInterval = null;
        btn.classList.remove('active');
        document.querySelectorAll('.cycle-ring').forEach(r => r.classList.remove('active'));
        showToast('Auto-cycle off');
      } else {
        const tiles = document.querySelectorAll('.video');
        if (!focusedTile) toggleTileFocus(tiles[0]);
        btn.classList.add('active');
        startCycleRing();
        cycleInterval = setInterval(() => {
          const tiles = document.querySelectorAll('.video');
          const curIdx = focusedTile ? parseInt(focusedTile.dataset.index) : -1;
          const nextIdx = (curIdx + 1) % tiles.length;
          toggleTileFocus(tiles[nextIdx]);
          startCycleRing();
        }, CYCLE_DURATION * 1000);
        showToast(`Auto-cycle: ${CYCLE_DURATION}s per stream`);
      }
    }

    function startCycleRing() {
      document.querySelectorAll('.cycle-ring').forEach(r => r.classList.remove('active'));
      if (focusedTile) {
        const ring = focusedTile.querySelector('.cycle-ring');
        if (ring) {
          ring.style.setProperty('--cycle-duration', CYCLE_DURATION + 's');
          ring.classList.add('active');
        }
      }
    }

    // ─── Alert sound notification ───
    let alertSoundEnabled = localStorage.getItem('alertSound') !== 'false';
    let lastAlertIds = new Set();
    let alertAudioCtx = null;

    function initAlertSoundBtn() {
      const btn = document.getElementById('btnSound');
      if (!alertSoundEnabled) btn.classList.add('muted');
    }

    function toggleAlertSound() {
      alertSoundEnabled = !alertSoundEnabled;
      const btn = document.getElementById('btnSound');
      btn.classList.toggle('muted', !alertSoundEnabled);
      localStorage.setItem('alertSound', alertSoundEnabled);
      showToast(alertSoundEnabled ? 'Alert sound on' : 'Alert sound muted');
    }

    function playAlertTone(type) {
      try {
        if (!alertAudioCtx) alertAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const ctx = alertAudioCtx;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'tornado') {
          osc.frequency.value = 880;
          osc.type = 'sawtooth';
          gain.gain.value = 0.15;
          osc.start();
          osc.frequency.linearRampToValueAtTime(440, ctx.currentTime + 0.5);
          gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 1);
          osc.stop(ctx.currentTime + 1);
        } else {
          osc.frequency.value = 660;
          osc.type = 'square';
          gain.gain.value = 0.1;
          osc.start();
          gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.6);
          osc.stop(ctx.currentTime + 0.6);
        }
      } catch (e) { /* AudioContext not available */ }
    }

    function checkNewAlerts(alerts) {
      if (!alertSoundEnabled || lastAlertIds.size === 0) {
        lastAlertIds = new Set(alerts.map(f => f.properties.id || f.id));
        return;
      }
      let hasNewTornado = false;
      let hasNewSevere = false;
      alerts.forEach(f => {
        const id = f.properties.id || f.id;
        if (!lastAlertIds.has(id)) {
          const ev = f.properties.event || '';
          if (ev.includes('Tornado Warning')) hasNewTornado = true;
          else hasNewSevere = true;
        }
      });
      lastAlertIds = new Set(alerts.map(f => f.properties.id || f.id));

      if (hasNewTornado) {
        playAlertTone('tornado');
        document.querySelector('nav').classList.add('alert-flash');
        setTimeout(() => document.querySelector('nav').classList.remove('alert-flash'), 2000);
      } else if (hasNewSevere) {
        playAlertTone('severe');
      }
    }

    initAlertSoundBtn();

    // ─── Restore saved state from localStorage ───
    (function restoreState() {
      if (localStorage.getItem('sidebarHidden') === 'true') {
        document.querySelector('.sidebar').classList.add('hidden');
        document.body.classList.add('grid-no-sidebar');
      }
      const savedFocus = localStorage.getItem('focusedTile');
      if (savedFocus !== null && savedFocus !== '') {
        const tiles = document.querySelectorAll('.video');
        const idx = parseInt(savedFocus);
        if (tiles[idx]) {
          tiles[idx].classList.add('focused');
          videoGrid.classList.add('has-focus');
          focusedTile = tiles[idx];
        }
      }
    })();
  </script>
</body>
</html>
